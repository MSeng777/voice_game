<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Voice Word Chain Game</title>
  <style>
    body { font-family: sans-serif; text-align: center; margin-top: 50px; background: #f4f4f9; }
    #status { font-weight: bold; margin: 20px; font-size: 1.2rem; color: #333; }
    #round { font-size: 1rem; color: #666; margin-bottom: 10px; }
    #log { max-width: 400px; margin: auto; text-align: left; background: white; padding: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); max-height: 300px; overflow-y: auto; }
    button { padding: 12px 24px; font-size: 1rem; cursor: pointer; border: none; background: #007bff; color: white; border-radius: 5px; }
  </style>
</head>
<body>

  <h1>Voice Word Chain Game</h1>
  <div id="round">Round: 0 / 10</div>
  <button onclick="startGame()">Start Game</button>
  <div id="status">Press "Start Game" to begin.</div>
  <div id="log"></div>

  <script>
    const dictionary = {
      'a': ['apple', 'ant', 'anchor', 'alligator', 'airplane', 'arrow', 'artist', 'avocado'],
      'b': ['bear', 'ball', 'banana', 'boat', 'bird', 'book', 'bell', 'bus'],
      'c': ['cat', 'car', 'cake', 'cup', 'cow', 'clock', 'coin', 'camel'],
      'd': ['dog', 'duck', 'door', 'drum', 'desk', 'deer', 'dragon', 'dolphin'],
      'e': ['elephant', 'eagle', 'egg', 'engine', 'earth', 'elk', 'elbow'],
      'f': ['fish', 'frog', 'fox', 'flag', 'flower', 'feather', 'fire', 'forest'],
      'g': ['giraffe', 'gold', 'goose', 'grape', 'guitar', 'garden', 'goat'],
      'h': ['horse', 'hat', 'house', 'hammer', 'heart', 'hippo', 'honey'],
      'i': ['ice', 'igloo', 'island', 'ink', 'iron', 'ivy'],
      'k': ['kite', 'king', 'koala', 'kangaroo', 'key', 'kiwi'],
      'l': ['lion', 'leaf', 'lemon', 'lamp', 'lizard', 'lock'],
      'm': ['monkey', 'moon', 'mouse', 'milk', 'mountain', 'map'],
      'n': ['nest', 'night', 'needle', 'nut', 'net', 'note'],
      'o': ['owl', 'orange', 'octopus', 'ocean', 'ostrich', 'onion'],
      'p': ['panda', 'pen', 'pizza', 'pig', 'penguin', 'pear'],
      'r': ['rabbit', 'robot', 'ring', 'rose', 'river', 'rocket'],
      's': ['snake', 'sun', 'star', 'ship', 'spider', 'spoon'],
      't': ['tiger', 'ten', 'tree', 'turtle', 'train', 'table', 'telephone'],
      'u': ['umbrella', 'unicorn', 'uncle'],
      'w': ['whale', 'wolf', 'window', 'watch', 'water'],
      'y': ['yak', 'yellow', 'yacht', 'yo-yo']
    };

    let usedWords = new Set();
    let currentLastLetter = '';
    let totalTurns = 0;
    const MAX_TURNS = 10;
    let playerScore = 0;
    let computerScore = 0;
    let isGameActive = false;

    const synth = window.speechSynthesis;
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition;

    if (SpeechRecognition) {
      recognition = new SpeechRecognition();
      recognition.lang = 'en-US';
      recognition.continuous = true; // Keeps microphone listening continuously
      recognition.interimResults = false;

      recognition.onresult = (event) => {
        if (!isGameActive) return;

        const lastIndex = event.results.length - 1;
        const spokenWord = event.results[lastIndex][0].transcript.toLowerCase().trim().replace(/[^a-z]/g, '');
        
        if (spokenWord) {
          document.getElementById('status').innerText = `You said: "${spokenWord}"`;
          processPlayerTurn(spokenWord);
        }
      };

      recognition.onerror = (event) => {
        console.log("Speech recognition error:", event.error);
      };
    } else {
      alert("Please open this file in Google Chrome.");
    }

    function speak(text, callback) {
      synth.cancel(); // Stop any previous speech
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.onend = () => { if (callback) callback(); };
      synth.speak(utterance);
    }

    function log(text) {
      const logDiv = document.getElementById('log');
      logDiv.innerHTML += `<p>${text}</p>`;
      logDiv.scrollTop = logDiv.scrollHeight;
    }

    function updateTurnUI() {
      document.getElementById('round').innerText = `Turn: ${totalTurns} / ${MAX_TURNS}`;
    }

    function startGame() {
      usedWords.clear();
      totalTurns = 0;
      playerScore = 0;
      computerScore = 0;
      isGameActive = true;
      
      document.getElementById('log').innerHTML = '';
      updateTurnUI();

      try { recognition.start(); } catch(e) {}

      const startWord = "elephant";
      usedWords.add(startWord);
      currentLastLetter = startWord.slice(-1);
      totalTurns++;
      computerScore++;
      updateTurnUI();

      log(`Computer (1): <b>${startWord}</b>`);
      speak(`Game started! I go first with ${startWord}. Your letter is ${currentLastLetter}.`);
    }

    function processPlayerTurn(word) {
      if (!isGameActive) return;

      // Validate first letter
      if (word.charAt(0) !== currentLastLetter) {
        speak(`No, ${word} does not start with ${currentLastLetter}. Try again.`);
        return;
      }

      // Validate duplicate
      if (usedWords.has(word)) {
        speak(`${word} was already used. Try a different word.`);
        return;
      }

      // Valid player turn
      usedWords.add(word);
      playerScore++;
      totalTurns++;
      updateTurnUI();
      log(`You (${totalTurns}): <b>${word}</b>`);

      if (checkGameOver()) return;

      // Computer turn setup
      const playerLastLetter = word.slice(-1);
      const options = dictionary[playerLastLetter] || [];
      const availableOptions = options.filter(w => !usedWords.has(w));

      if (availableOptions.length === 0) {
        speak(`I have no more words starting with ${playerLastLetter}. You win this round!`);
        endGame("You Win! Computer ran out of words.");
        return;
      }

      const computerResponse = availableOptions[Math.floor(Math.random() * availableOptions.length)];
      usedWords.add(computerResponse);
      computerScore++;
      totalTurns++;
      currentLastLetter = computerResponse.slice(-1);
      updateTurnUI();

      log(`Computer (${totalTurns}): <b>${computerResponse}</b>`);

      if (checkGameOver()) {
        speak(`My word is ${computerResponse}. That reaches 10 turns.`);
      } else {
        speak(`${computerResponse}. Your letter is ${currentLastLetter}.`);
      }
    }

    function checkGameOver() {
      if (totalTurns >= MAX_TURNS) {
        let resultMsg = "";
        if (playerScore > computerScore) {
          resultMsg = "Game over! You win!";
        } else if (computerScore > playerScore) {
          resultMsg = "Game over! Computer wins!";
        } else {
          resultMsg = "Game over! It's a tie!";
        }
        endGame(resultMsg);
        return true;
      }
      return false;
    }

    function endGame(message) {
      isGameActive = false;
      document.getElementById('status').innerText = message;
      speak(message);
      try { recognition.stop(); } catch(e) {}
    }
  </script>
</body>
</html>
