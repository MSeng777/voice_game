<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Voice Word Chain Game</title>
  <style>
    body { font-family: sans-serif; text-align: center; margin-top: 30px; background: #f4f4f9; padding: 15px; }
    #status { font-weight: bold; margin: 20px; font-size: 1.2rem; color: #333; }
    #round { font-size: 1rem; color: #666; margin-bottom: 10px; }
    #log { max-width: 100%; margin: auto; text-align: left; background: white; padding: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); max-height: 250px; overflow-y: auto; }
    button { padding: 15px 30px; font-size: 1.2rem; cursor: pointer; border: none; background: #007bff; color: white; border-radius: 8px; width: 100%; max-width: 300px; }
  </style>
</head>
<body>

  <h1>Voice Word Chain Game</h1>
  <div id="round">Round: 0 / 10</div>
  <button id="startBtn" onclick="startGame()">Start Game</button>
  <div id="status">Tap "Start Game" to begin.</div>
  <div id="log"></div>

  <script>
    const dictionary = {
      'a': ['apple', 'ant', 'anchor', 'airplane'],
      'b': ['bear', 'ball', 'banana', 'boat'],
      'c': ['cat', 'car', 'cake', 'cup'],
      'd': ['dog', 'duck', 'door', 'drum'],
      'e': ['elephant', 'eagle', 'egg', 'engine'],
      'f': ['fish', 'frog', 'fox', 'flag'],
      'g': ['giraffe', 'gold', 'goose', 'grape'],
      'h': ['horse', 'hat', 'house', 'hammer'],
      'i': ['ice', 'igloo', 'island'],
      'k': ['kite', 'king', 'koala'],
      'l': ['lion', 'leaf', 'lemon'],
      'm': ['monkey', 'moon', 'mouse'],
      'n': ['nest', 'night', 'needle', 'nut'],
      'o': ['owl', 'orange', 'octopus'],
      'p': ['panda', 'pen', 'pizza'],
      'r': ['rabbit', 'robot', 'ring'],
      's': ['snake', 'sun', 'star'],
      't': ['tiger', 'ten', 'tree', 'turtle'],
      'u': ['umbrella', 'unicorn'],
      'w': ['whale', 'wolf', 'window'],
      'y': ['yak', 'yellow']
    };

    let usedWords = new Set();
    let currentLastLetter = '';
    let totalTurns = 0;
    const MAX_TURNS = 10;
    let playerScore = 0;
    let computerScore = 0;
    let isGameActive = false;

    const synth = window.speechSynthesis;
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition;

    if (SpeechRecognition) {
      recognition = new SpeechRecognition();
      recognition.lang = 'en-US';
      recognition.continuous = false; // Works more reliably across mobile browsers
      recognition.interimResults = false;

      recognition.onresult = (event) => {
        if (!isGameActive) return;
        const spokenWord = event.results[0][0].transcript.toLowerCase().trim().replace(/[^a-z]/g, '');
        if (spokenWord) {
          document.getElementById('status').innerText = `You said: "${spokenWord}"`;
          processPlayerTurn(spokenWord);
        }
      };

      recognition.onerror = (event) => {
        if (isGameActive && event.error !== 'no-speech') {
          document.getElementById('status').innerText = "Listening... speak now!";
          setTimeout(startListening, 1000);
        }
      };

      recognition.onend = () => {
        // Automatically restart listening if game is active and computer is not talking
        if (isGameActive && !synth.speaking) {
          startListening();
        }
      };
    } else {
      alert("Speech recognition is not supported on this mobile browser. Try Chrome on Android or Safari on iOS.");
    }

    function startListening() {
      try {
        recognition.start();
        document.getElementById('status').innerText = "Listening... Speak your word!";
      } catch(e) {}
    }

    function speak(text, callback) {
      try { recognition.stop(); } catch(e) {} // Pause listening while speaking
      synth.cancel();

      const utterance = new SpeechSynthesisUtterance(text);
      utterance.onend = () => {
        if (callback) callback();
        if (isGameActive) startListening(); // Resume listening after speaking stops
      };
      synth.speak(utterance);
    }

    function log(text) {
      const logDiv = document.getElementById('log');
      logDiv.innerHTML += `<p>${text}</p>`;
      logDiv.scrollTop = logDiv.scrollHeight;
    }

    function updateTurnUI() {
      document.getElementById('round').innerText = `Turn: ${totalTurns} / ${MAX_TURNS}`;
    }

    function startGame() {
      usedWords.clear();
      totalTurns = 0;
      playerScore = 0;
      computerScore = 0;
      isGameActive = true;
      
      document.getElementById('log').innerHTML = '';
      
      const startWord = "elephant";
      usedWords.add(startWord);
      currentLastLetter = startWord.slice(-1);
      totalTurns++;
      computerScore++;
      updateTurnUI();

      log(`Computer (1): <b>${startWord}</b>`);
      speak(`Game started! I start with ${startWord}. Your letter is ${currentLastLetter}.`);
    }

    function processPlayerTurn(word) {
      if (!isGameActive) return;

      if (word.charAt(0) !== currentLastLetter) {
        speak(`No, ${word} does not start with ${currentLastLetter}. Try again.`);
        return;
      }

      if (usedWords.has(word)) {
        speak(`${word} was already used. Try a different word.`);
        return;
      }

      usedWords.add(word);
      playerScore++;
      totalTurns++;
      updateTurnUI();
      log(`You (${totalTurns}): <b>${word}</b>`);

      if (checkGameOver()) return;

      const playerLastLetter = word.slice(-1);
      const options = dictionary[playerLastLetter] || [];
      const availableOptions = options.filter(w => !usedWords.has(w));

      if (availableOptions.length === 0) {
        speak(`I have no more words starting with ${playerLastLetter}. You win!`);
        endGame("You Win! Computer ran out of words.");
        return;
      }

      const computerResponse = availableOptions[Math.floor(Math.random() * availableOptions.length)];
      usedWords.add(computerResponse);
      computerScore++;
      totalTurns++;
      currentLastLetter = computerResponse.slice(-1);
      updateTurnUI();

      log(`Computer (${totalTurns}): <b>${computerResponse}</b>`);

      if (checkGameOver()) {
        speak(`My word is ${computerResponse}. That reaches 10 turns.`);
      } else {
        speak(`${computerResponse}. Your letter is ${currentLastLetter}.`);
      }
    }

    function checkGameOver() {
      if (totalTurns >= MAX_TURNS) {
        let resultMsg = playerScore >= computerScore ? "Game over! You win!" : "Game over! Computer wins!";
        endGame(resultMsg);
        return true;
      }
      return false;
    }

    function endGame(message) {
      isGameActive = false;
      document.getElementById('status').innerText = message;
      speak(message);
      try { recognition.stop(); } catch(e) {}
    }
  </script>
</body>
</html>
