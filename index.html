<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>USJ_21</title>
  <style>
    body { font-family: sans-serif; text-align: center; margin-top: 20px; background: #f4f4f9; padding: 15px; }
    #status { font-weight: bold; margin: 15px; font-size: 1.2rem; color: #007bff; min-height: 40px; }
    #round { font-size: 1rem; color: #666; margin-bottom: 10px; }
    #log { max-width: 100%; margin: auto; text-align: left; background: white; padding: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); max-height: 220px; overflow-y: auto; }
    .btn { padding: 16px 20px; font-size: 1.2rem; cursor: pointer; border: none; border-radius: 8px; width: 100%; max-width: 320px; margin: 8px 0; font-weight: bold; }
    #startBtn { background: #28a745; color: white; }
    #talkBtn { background: #007bff; color: white; display: none; }
  </style>
</head>
<body>

  <h1>USJ_21</h1>
  <div id="round">Round: 0 / 10</div>
  <button id="startBtn" class="btn" onclick="startGame()">Start New Game</button>
  <button id="talkBtn" class="btn" onclick="startListening()">🎤 Tap & Speak Your Word</button>
  <div id="status">Tap "Start New Game" to begin.</div>
  <div id="log"></div>

  <script>
    const dictionary = {
      'a': ['apple', 'ant', 'anchor', 'airplane', 'alligator'],
      'b': ['bear', 'ball', 'banana', 'boat', 'butterfly'],
      'c': ['cat', 'car', 'cake', 'cup', 'camel'],
      'd': ['dog', 'duck', 'door', 'drum', 'dolphin'],
      'e': ['elephant', 'eagle', 'egg', 'engine'],
      'f': ['fish', 'frog', 'fox', 'flag', 'forest'],
      'g': ['giraffe', 'gold', 'goose', 'grape', 'guitar', 'great'],
      'h': ['horse', 'hat', 'house', 'hammer', 'hippo'],
      'i': ['ice', 'igloo', 'island', 'iron'],
      'k': ['kite', 'king', 'koala', 'kangaroo'],
      'l': ['lion', 'leaf', 'lemon', 'lizard'],
      'm': ['monkey', 'moon', 'mouse', 'mountain'],
      'n': ['nest', 'night', 'needle', 'nut'],
      'o': ['owl', 'orange', 'octopus', 'ocean', 'over'],
      'p': ['panda', 'pen', 'pizza', 'penguin'],
      'r': ['rabbit', 'robot', 'ring', 'rocket'],
      's': ['snake', 'sun', 'star', 'spider'],
      't': ['tiger', 'ten', 'tree', 'turtle', 'train'],
      'u': ['umbrella', 'unicorn'],
      'w': ['whale', 'wolf', 'window', 'water'],
      'y': ['yak', 'yellow']
    };

    let usedWords = new Set();
    let currentLastLetter = '';
    let totalTurns = 0;
    const MAX_TURNS = 10;
    let playerScore = 0;
    let computerScore = 0;
    let isGameActive = false;

    const synth = window.speechSynthesis;
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition;

    if (SpeechRecognition) {
      recognition = new SpeechRecognition();
      recognition.lang = 'en-US';
      recognition.continuous = false;
      recognition.interimResults = false;

      recognition.onresult = (event) => {
        if (!isGameActive) return;
        
        const rawPhrase = event.results[0][0].transcript.toLowerCase().trim();
        document.getElementById('status').innerText = `I heard: "${rawPhrase}"`;
        
        // Find the valid word in the phrase that starts with the required letter
        const words = rawPhrase.replace(/[^a-z\s]/g, '').split(/\s+/);
        let foundWord = words.find(w => w.charAt(0) === currentLastLetter);

        // Fallback to the last spoken word if no match found
        if (!foundWord && words.length > 0) {
          foundWord = words[words.length - 1];
        }

        if (foundWord) {
          processPlayerTurn(foundWord);
        } else {
          speak("I didn't hear a word. Tap the button and try again.");
        }
      };

      recognition.onerror = () => {
        if (isGameActive) {
          document.getElementById('status').innerText = "Didn't catch that. Tap 'Tap & Speak' to try again.";
        }
      };
    } else {
      alert("Speech recognition is not supported on this browser.");
    }

    function startListening() {
      if (!isGameActive) return;
      synth.cancel();
      try {
        recognition.start();
        document.getElementById('status').innerText = "🎤 Listening... Say your word now!";
      } catch(e) {}
    }

    function speak(text, callback) {
      synth.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.onend = () => { if (callback) callback(); };
      synth.speak(utterance);
    }

    function log(text) {
      const logDiv = document.getElementById('log');
      logDiv.innerHTML += `<p>${text}</p>`;
      logDiv.scrollTop = logDiv.scrollHeight;
    }

    function updateTurnUI() {
      document.getElementById('round').innerText = `Turn: ${totalTurns} / ${MAX_TURNS}`;
    }

    function getRandomStartWord() {
      const keys = Object.keys(dictionary);
      const randomKey = keys[Math.floor(Math.random() * keys.length)];
      const words = dictionary[randomKey];
      return words[Math.floor(Math.random() * words.length)];
    }

    function startGame() {
      usedWords.clear();
      totalTurns = 0;
      playerScore = 0;
      computerScore = 0;
      isGameActive = true;
      
      document.getElementById('log').innerHTML = '';
      document.getElementById('talkBtn').style.display = 'inline-block';
      
      const startWord = getRandomStartWord();
      usedWords.add(startWord);
      currentLastLetter = startWord.slice(-1);
      totalTurns++;
      computerScore++;
      updateTurnUI();

      log(`Computer (1): <b>${startWord}</b>`);
      speak(`Game started! I start with ${startWord}. Your letter is ${currentLastLetter}. Tap the blue button to speak.`);
    }

    function processPlayerTurn(word) {
      if (!isGameActive) return;

      if (word.charAt(0) !== currentLastLetter) {
        speak(`${word} does not start with ${currentLastLetter}. Tap button to try again.`);
        return;
      }

      if (usedWords.has(word)) {
        speak(`${word} was already used. Tap button to try another word.`);
        return;
      }

      usedWords.add(word);
      playerScore++;
      totalTurns++;
      updateTurnUI();
      log(`You (${totalTurns}): <b>${word}</b>`);

      if (checkGameOver()) return;

      const playerLastLetter = word.slice(-1);
      const options = dictionary[playerLastLetter] || [];
      const availableOptions = options.filter(w => !usedWords.has(w));

      if (availableOptions.length === 0) {
        speak(`I have no more words starting with ${playerLastLetter}. You win!`);
        endGame("You Win! Computer ran out of words.");
        return;
      }

      const computerResponse = availableOptions[Math.floor(Math.random() * availableOptions.length)];
      usedWords.add(computerResponse);
      computerScore++;
      totalTurns++;
      currentLastLetter = computerResponse.slice(-1);
      updateTurnUI();

      log(`Computer (${totalTurns}): <b>${computerResponse}</b>`);

      if (checkGameOver()) {
        speak(`My word is ${computerResponse}. Game finished!`);
      } else {
        speak(`${computerResponse}. Your letter is ${currentLastLetter}.`);
      }
    }

    function checkGameOver() {
      if (totalTurns >= MAX_TURNS) {
        let resultMsg = playerScore >= computerScore ? "Game over! You win!" : "Game over! Computer wins!";
        endGame(resultMsg);
        return true;
      }
      return false;
    }

    function endGame(message) {
      isGameActive = false;
      document.getElementById('talkBtn').style.display = 'none';
      document.getElementById('status').innerText = message;
      speak(message);
    }
  </script>
</body>
</html>
